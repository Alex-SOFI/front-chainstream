<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Icône Blaise, 3 blocs, monochrome -->
  <!-- petit carré en haut à gauche -->
  <rect x="4" y="4" width="10" height="10" rx="2" fill="currentColor"></rect>
  <!-- bloc droit au centre (arrondi) -->
  <rect x="14" y="10" width="14" height="10" rx="4" fill="currentColor"></rect>
  <!-- barre du bas -->
  <rect x="4" y="18" width="24" height="10" rx="5" fill="currentColor"></rect>
</svg>
